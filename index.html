<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<title>2b2t.place</title>
	<style>
		html,
		body {
			background-color: black;
			margin: 0;
			padding: 0;
			overflow: hidden;
			overscroll-behavior: none;
		}
	</style>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<ui>
		<div class="searchBar ui">
			<icon>search</icon>
			<input type="text" name="Search" placeholder="Search" id="search">
			<icon>directions</icon>
			<icon>more</icon>
		</div>
		<div class="searchPanel ui" id="searchPanel"></div>
		<div class="bottomLeft">
			<div class="layersettings ui" id="layersettings">
				<div class="label">
					<icon>settings</icon>
					<div id="layersettingslabel">Layer Settings</div>
				</div>
			</div>
			<div class="layers ui" id="layers">
				<div class="label">
					<div class="title" id="layerstitle">
						<icon>layers</icon>
						Layers
					</div>
					<div class="close" id="layerclose">
						<icon>close</icon>
					</div>
				</div>
			</div>
		</div>
		<div class="topRight">
			<div class="coordinates ui noFloat" id="overworldCoordinates">
				<icon>world</icon>
				<div id="coordinateText">0 0</div>
			</div>
			<div class="coordinates ui noFloat" id="netherCoordinates">
				<icon>obsidian</icon>
				<div id="coordinateTextNether">0 0</div>
			</div>
		</div>
		<div class="bottomMiddle">
			<div class="ui noFloat" id="overworldToggle">
				<icon>world</icon>
				Overworld
			</div>
			<div class="ui noFloat" id="netherToggle">
				<icon>obsidian</icon>
				Nether
			</div>
			<div class="ui noFloat" id="endToggle">
				<icon>enderchest</icon>
				End
			</div>
		</div>
		<div class="rightClick ui" id="rightClickContext">
			<div class="item" id="copycoordinates">
				<icon>pin</icon>
				Copy Coordinates
			</div>
			<div class="item" id="copylink">
				<icon>link</icon>
				Share View
			</div>
			<div class="divider"></div>
			<div class="item" id="placemarker">
				<icon>addpin</icon>
				Place Marker
			</div>
			<div class="item" id="removemarker">
				<icon>removepin</icon>
				Remove Marker
			</div>
		</div>
		<div class="copyLinkScreen" id="copyLinkScreen">
			<div class="copyLinkDialogue ui noFloat">
				<div class="heading">
					<div class="title" id="copyLinkTitle">Share<icon>close</icon></div>
					<div class="tablist">
						<div class="tab selected"><icon>link</icon>Send link</div>
						<div class="tab"><icon>layers</icon>Embed map</div>
					</div>
				</div>
				<div class="body" id="copyLinkBody">
				</div>
				<div class="copyLink">
					<input readonly type="text" value="" id="copyLinkText">
					<button class="copyLinkButton" id="copyLinkButton"><div class="popup" id="copyPopup">Copied!</div><icon>copy</icon>Copy Link</button>
				</div>
			</div>
		</div>
	</ui>
	<main></main>
	<script src="https://q5js.org/q5.js"></script>
	<script src="https://p5play.org/v3/planck.min.js"></script>
	<script src="https://p5play.org/v3/p5play.js"></script>
	<script src="sketch.js"></script>
</body>

</html>
